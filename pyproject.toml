[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofdm-adaptive-link-simulator"
version = "0.1.0"
description = "Reproducible OFDM link simulation with QAM, AWGN/Rayleigh channels, BER sweeps, and adaptive modulation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mahmoud Alqudah"}]
dependencies = ["numpy>=2.0,<3.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4.0"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1.0"]

[project.scripts]
ofdm-link = "ofdm_link.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
